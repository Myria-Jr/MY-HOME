<title>Smyčka Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&family=Roboto+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<style>
/* Layout: Material 3 Expressive. Nav bar (phone) / nav rail (wide); app bar, floating transport toolbar with wavy progress, then one view at a time */
:root{
  --primary:hsl(280 60% 42%);--on-primary:#fff;--primary-c:hsl(280 85% 91%);--on-primary-c:hsl(280 70% 15%);
  --secondary-c:hsl(280 30% 88%);--on-secondary-c:hsl(280 30% 18%);
  --tertiary:hsl(340 50% 42%);--tertiary-c:hsl(340 80% 90%);--on-tertiary-c:hsl(340 60% 15%);
  --surface:hsl(280 30% 98%);--sc-low:hsl(280 25% 96%);--sc:hsl(280 22% 94%);--sc-high:hsl(280 20% 91%);--sc-highest:hsl(280 18% 88%);
  --on-surface:hsl(280 15% 11%);--on-surface-v:hsl(280 10% 30%);--outline:hsl(280 8% 48%);--outline-v:hsl(280 12% 80%);
  --inv:hsl(280 12% 18%);--on-inv:hsl(280 20% 94%);--error:#ba1a1a;--rec:#e5374f;
  --font:"Roboto Flex",Roboto,system-ui,-apple-system,sans-serif;--mono:"Roboto Mono",ui-monospace,monospace;
  --spring:cubic-bezier(.34,1.56,.5,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --primary:hsl(280 75% 82%);--on-primary:hsl(280 70% 18%);--primary-c:hsl(280 45% 30%);--on-primary-c:hsl(280 85% 91%);
  --secondary-c:hsl(280 18% 27%);--on-secondary-c:hsl(280 30% 88%);
  --tertiary:hsl(340 60% 80%);--tertiary-c:hsl(340 40% 28%);--on-tertiary-c:hsl(340 80% 90%);
  --surface:hsl(280 15% 7%);--sc-low:hsl(280 14% 10%);--sc:hsl(280 13% 12%);--sc-high:hsl(280 12% 16%);--sc-highest:hsl(280 11% 20%);
  --on-surface:hsl(280 20% 91%);--on-surface-v:hsl(280 12% 76%);--outline:hsl(280 8% 56%);--outline-v:hsl(280 10% 28%);
  --inv:hsl(280 20% 90%);--on-inv:hsl(280 12% 16%);color-scheme:dark}}
:root[data-theme="dark"]{
  --primary:hsl(280 75% 82%);--on-primary:hsl(280 70% 18%);--primary-c:hsl(280 45% 30%);--on-primary-c:hsl(280 85% 91%);
  --secondary-c:hsl(280 18% 27%);--on-secondary-c:hsl(280 30% 88%);
  --tertiary:hsl(340 60% 80%);--tertiary-c:hsl(340 40% 28%);--on-tertiary-c:hsl(340 80% 90%);
  --surface:hsl(280 15% 7%);--sc-low:hsl(280 14% 10%);--sc:hsl(280 13% 12%);--sc-high:hsl(280 12% 16%);--sc-highest:hsl(280 11% 20%);
  --on-surface:hsl(280 20% 91%);--on-surface-v:hsl(280 12% 76%);--outline:hsl(280 8% 56%);--outline-v:hsl(280 10% 28%);
  --inv:hsl(280 20% 90%);--on-inv:hsl(280 12% 16%);color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--surface);color:var(--on-surface);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-tap-highlight-color:transparent;transition:background .3s}
button,input,select,textarea{font:inherit;color:inherit}
.ms{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 500,'opsz' 24;display:inline-block;width:1em;overflow:hidden}
.ms.f{font-variation-settings:'FILL' 1,'wght' 500,'opsz' 24}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}

/* ---- navigation ---- */
.nav{position:fixed;z-index:30;left:0;right:0;bottom:0;display:flex;background:var(--sc);
  padding:10px max(6px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.nav button{all:unset;cursor:pointer;flex:1;min-width:0;display:grid;justify-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--on-surface-v);font-stretch:95%}
.nav .ind{width:56px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background .25s,width .4s var(--spring)}
.nav button[aria-current="page"]{color:var(--on-surface)}
.nav button[aria-current="page"] .ind{background:var(--secondary-c);color:var(--on-secondary-c)}
.nav button[aria-current="page"] .ms{font-variation-settings:'FILL' 1,'wght' 600,'opsz' 24}
.nav button:active .ind{width:44px}
.app{max-width:1120px;margin:0 auto;display:grid;gap:16px;padding-block:16px 120px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:900px){
  .nav{top:0;right:auto;width:96px;flex-direction:column;justify-content:center;gap:14px;padding:24px 0;padding-left:env(safe-area-inset-left,0px)}
  .nav button{flex:none}
  .app{padding-left:max(120px,calc(96px + 24px + env(safe-area-inset-left,0px)));padding-block:24px 40px}
}

/* ---- app bar ---- */
.appbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:44px;height:44px;flex:none;background:var(--primary);border-radius:14px 22px 14px 22px;display:grid;place-items:center;color:var(--on-primary);transition:border-radius .6s var(--spring)}
.logo:hover{border-radius:22px 14px 22px 14px}
.brand h1{margin:0;font-size:28px;font-weight:800;font-stretch:125%;letter-spacing:-.02em;line-height:1}
.brand small{display:block;color:var(--on-surface-v);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{all:unset;cursor:pointer;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;font-stretch:120%;
  background:hsl(var(--ah) 70% 62%);color:hsl(var(--ah) 70% 12%);transition:border-radius .4s var(--spring),transform .3s var(--spring)}
.avatar:hover{border-radius:16px}

/* ---- toolbar ---- */
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--sc-high);border-radius:32px;padding:8px}
.fab{all:unset;cursor:pointer;width:64px;height:64px;border-radius:20px;background:var(--primary-c);color:var(--on-primary-c);display:grid;place-items:center;flex:none;
  box-shadow:0 3px 8px -2px rgba(0,0,0,.25);transition:border-radius .45s var(--spring),background .2s,transform .2s var(--spring)}
.fab .ms{font-size:32px}
.fab.on{border-radius:32px;background:var(--primary);color:var(--on-primary)}
.fab:active{transform:scale(.92)}
.ib{all:unset;cursor:pointer;width:48px;height:48px;border-radius:24px;display:grid;place-items:center;color:var(--on-surface-v);flex:none;transition:border-radius .35s var(--spring),background .2s}
.ib:hover{background:var(--sc-highest)}
.ib[aria-pressed="true"]{background:var(--secondary-c);color:var(--on-secondary-c);border-radius:14px}
.ib.recb[aria-pressed="true"]{background:var(--rec);color:#fff}
.ib.recb[aria-pressed="true"] .ms{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
.bpmbox{display:flex;align-items:center;gap:2px;background:var(--sc-highest);border-radius:24px;padding:0 4px;height:48px}
.bpmbox .ib{width:40px;height:40px}
.bpmbox b{font-family:var(--mono);font-size:15px;min-width:3ch;text-align:center;font-variant-numeric:tabular-nums}
.bpmbox small{font-size:11px;color:var(--on-surface-v);margin-right:4px}
.wave{flex:1 1 140px;min-width:100px;height:20px;margin:0 10px}
.wave path{fill:none;stroke-linecap:round;stroke-width:4}

.hint{margin:0;color:var(--on-surface-v);font-size:13px;padding-inline:4px;min-height:1.4em}
.view[hidden]{display:none!important}
.card{background:var(--sc-low);border-radius:28px;padding:20px}
.h2{margin:0;font-size:22px;font-weight:750;font-stretch:115%;letter-spacing:-.01em}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--primary)}

/* ---- buttons ---- */
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:20px;font-weight:600;
  background:var(--secondary-c);color:var(--on-secondary-c);transition:border-radius .35s var(--spring),transform .2s var(--spring);white-space:nowrap}
.btn .ms{font-size:20px}
.btn:active{border-radius:10px;transform:scale(.97)}
.btn.fill{background:var(--primary);color:var(--on-primary)}
.btn.out{background:transparent;box-shadow:inset 0 0 0 1px var(--outline)}
.btn.danger{background:transparent;color:var(--error);box-shadow:inset 0 0 0 1px var(--error)}
.btn.rec{background:var(--rec);color:#fff}
.cbg{display:inline-flex;gap:2px;flex-wrap:wrap}
.cbg button{all:unset;cursor:pointer;height:40px;padding:0 16px;display:inline-flex;align-items:center;gap:6px;background:var(--sc-highest);color:var(--on-surface-v);font-weight:600;border-radius:8px;transition:border-radius .4s var(--spring),background .2s,color .2s}
.cbg button:first-child{border-radius:20px 8px 8px 20px}
.cbg button:last-child{border-radius:8px 20px 20px 8px}
.cbg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-radius:20px}

/* ---- slider & switch ---- */
.m{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;--p:50%;cursor:pointer}
.m::-webkit-slider-runnable-track{height:16px;border-radius:8px;background:linear-gradient(90deg,var(--primary) 0 max(0px,calc(var(--p) - 6px)),transparent 0 calc(var(--p) + 6px),var(--secondary-c) 0)}
.m::-webkit-slider-thumb{-webkit-appearance:none;width:4px;height:44px;border-radius:2px;background:var(--primary);margin-top:-14px}
.m::-moz-range-track{height:16px;border-radius:8px;background:var(--secondary-c)}
.m::-moz-range-progress{height:16px;border-radius:8px;background:var(--primary)}
.m::-moz-range-thumb{width:4px;height:44px;border:0;border-radius:2px;background:var(--primary)}
.sw{-webkit-appearance:none;appearance:none;width:52px;height:32px;border-radius:16px;background:var(--sc-highest);box-shadow:inset 0 0 0 2px var(--outline);position:relative;cursor:pointer;flex:none;margin:0;transition:background .2s}
.sw::after{content:"";position:absolute;top:50%;left:8px;width:16px;height:16px;border-radius:50%;background:var(--outline);transform:translateY(-50%);transition:all .35s var(--spring)}
.sw:checked{background:var(--primary);box-shadow:none}
.sw:checked::after{left:24px;width:24px;height:24px;background:var(--on-primary)}
.sl{display:grid;gap:0}
.sl label{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--on-surface-v)}
.sl label span:last-child{font-family:var(--mono);font-weight:500}

/* ---- pads ---- */
.padsview{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:860px){.padsview{grid-template-columns:minmax(0,1fr)}}
.pads{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,1.6vw,14px);max-width:540px;margin:0 auto;width:100%}
.pad{all:unset;cursor:pointer;position:relative;aspect-ratio:1;max-width:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:11%;overflow:hidden;
  background:hsl(var(--h) 75% 87%);color:hsl(var(--h) 60% 17%);border-radius:28%;user-select:none;-webkit-user-select:none;touch-action:manipulation;
  transition:border-radius .5s var(--spring),transform .35s var(--spring),background .3s}
.dark .pad{background:hsl(var(--h) 32% 23%);color:hsl(var(--h) 80% 90%)}
.pad[data-cat="drums"]{border-radius:42%}
.pad[data-cat="guitar"]{border-radius:22% 40% 22% 40%}
.pad[data-cat="bass"]{border-radius:50% 16% 50% 16%}
.pad[data-cat="synth"]{border-radius:16% 50% 16% 50%}
.pad[data-cat="piano"]{border-radius:18%}
.pad[data-cat="fx"]{border-radius:50% 50% 18% 50%}
.pad[data-cat="custom"]{border-radius:34% 34% 50% 50%}
.pad b{font-size:clamp(13px,2.4vw,19px);font-weight:800;font-stretch:112%;line-height:1.05;overflow-wrap:anywhere}
.pad small{font-size:clamp(9px,1.4vw,11px);font-weight:600;opacity:.75}
.pad kbd{position:absolute;top:11%;right:12%;font-family:var(--mono);font-size:10px;opacity:.5;text-transform:uppercase}
.pad.sel{box-shadow:inset 0 0 0 3px hsl(var(--h) 70% 45%)}
.dark .pad.sel{box-shadow:inset 0 0 0 3px hsl(var(--h) 80% 75%)}
.pad.hit,.dark .pad.hit{transition:border-radius .12s,transform .1s,background 0s;border-radius:50%;transform:scale(.92);background:hsl(var(--h) 85% 56%);color:#fff}
.editor{display:grid;gap:10px}
.edhead{display:flex;align-items:center;gap:12px}
.edhead i{width:40px;height:40px;border-radius:12px 20px 12px 20px;background:hsl(var(--h) 75% 60%);flex:none}
.sel-field{appearance:none;width:100%;height:52px;border-radius:14px;border:0;padding:0 16px;background:var(--sc-highest);font-weight:600;box-shadow:inset 0 -2px 0 var(--outline)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.upload{position:relative;overflow:hidden}
.upload input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* ---- sequencer ---- */
.seqhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.seqscroll{overflow-x:auto;padding-bottom:8px}
.seq{display:grid;grid-template-columns:132px repeat(32,24px);gap:3px;align-items:center;width:max-content}
.lab{all:unset;cursor:pointer;position:sticky;left:0;z-index:1;background:var(--sc-low);height:24px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding-right:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lab .ms{font-size:16px;color:hsl(var(--h) 60% 50%)}
.lab.muted{opacity:.4}
.sc{all:unset;cursor:pointer;width:24px;height:24px;border-radius:7px;background:var(--sc-high);transition:border-radius .3s var(--spring)}
.sc.b{background:var(--sc-highest)}
.sc.on{background:hsl(var(--h) 70% 55%);border-radius:12px}
.sc.ph{box-shadow:inset 0 0 0 2px var(--on-surface)}

/* ---- keys ---- */
.keytools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.oct{display:flex;align-items:center;gap:6px;font-weight:600}
.kb{position:relative;display:flex;height:clamp(160px,30vw,240px);user-select:none;-webkit-user-select:none;touch-action:none}
.key{all:unset;cursor:pointer;flex:1;position:relative;margin:0 2px;border-radius:6px 6px 16px 16px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--outline-v),inset 0 -6px 0 var(--sc-high);display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;transition:border-radius .3s var(--spring)}
.key span{font-family:var(--mono);font-size:10px;color:var(--on-surface-v);text-transform:uppercase}
.key.blk{position:absolute;top:0;height:60%;width:4.4%;margin:0;transform:translateX(-50%);z-index:2;border-radius:4px 4px 12px 12px;background:var(--on-surface);box-shadow:none}
.key.blk span{color:var(--surface)}
.key.down{background:hsl(var(--h) 75% 62%);border-radius:6px 6px 28px 28px}
.key.blk.down{background:hsl(var(--h) 60% 42%)}

/* ---- mixer ---- */
.mixgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.ch{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px}
.ch .dot{width:28px;height:28px;border-radius:9px 14px 9px 14px;background:hsl(var(--h) 70% 60%)}
.ch .nm{font-weight:600;font-size:13px}
#viz{width:100%;height:120px;display:block;border-radius:20px;background:var(--sc-high)}

/* ---- library ---- */
.tpl{display:flex;gap:8px;flex-wrap:wrap}
.chip{all:unset;cursor:pointer;height:36px;padding:0 14px 0 10px;border-radius:10px;display:inline-flex;align-items:center;gap:6px;font-weight:600;box-shadow:inset 0 0 0 1px var(--outline-v);transition:border-radius .35s var(--spring),background .2s}
.chip:hover{background:var(--sc-high);border-radius:18px}
.chip .ms{font-size:18px}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.proj{background:var(--sc);border-radius:24px;padding:16px;display:grid;gap:10px;transition:border-radius .4s var(--spring)}
.proj.cur{background:var(--primary-c);color:var(--on-primary-c);border-radius:32px 12px 32px 12px}
.proj h3{margin:0;font-size:18px;font-weight:750;font-stretch:110%;overflow-wrap:anywhere}
.proj .meta{font-size:12px;opacity:.75;font-family:var(--mono)}
.proj input{width:100%;height:40px;border-radius:10px;border:0;padding:0 12px;background:var(--surface);font-weight:600}

/* ---- account ---- */
.accgrid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.accgrid{grid-template-columns:minmax(0,1fr)}}
.profile{display:grid;justify-items:center;text-align:center;gap:10px;background:var(--primary-c);color:var(--on-primary-c);border-radius:36px;padding:28px 20px}
.bigav{all:unset;cursor:pointer;width:112px;height:112px;display:grid;place-items:center;font-size:48px;font-weight:850;font-stretch:125%;
  background:hsl(var(--ah) 70% 62%);color:hsl(var(--ah) 70% 12%);border-radius:38% 62% 45% 55%/45% 40% 60% 55%;transition:border-radius .7s var(--spring),transform .3s var(--spring)}
.bigav:hover{border-radius:50%}
.bigav:active{transform:scale(.94)}
.profile input{width:100%;max-width:240px;height:48px;border-radius:24px;border:0;text-align:center;font-weight:700;font-size:17px;background:var(--surface);color:var(--on-surface)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.stats div{background:var(--surface);color:var(--on-surface);border-radius:18px;padding:10px 4px;display:grid}
.stats b{font-size:22px;font-weight:800;font-stretch:115%;font-variant-numeric:tabular-nums}
.stats small{font-size:11px;color:var(--on-surface-v)}
.setlist{display:grid;gap:4px}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--sc-low);padding:14px 18px;border-radius:8px}
.set:first-of-type{border-radius:24px 24px 8px 8px}.set:last-child{border-radius:8px 8px 24px 24px}
.set .t{font-weight:600;display:flex;align-items:center;gap:12px}
.set .t .ms{color:var(--on-surface-v)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{all:unset;cursor:pointer;width:36px;height:36px;border-radius:50%;background:hsl(var(--sh) 60% 52%);display:grid;place-items:center;color:#fff;transition:border-radius .4s var(--spring)}
.swatch[aria-pressed="true"]{border-radius:12px}
.swatch .ms{font-size:20px;opacity:0}.swatch[aria-pressed="true"] .ms{opacity:1}
textarea{width:100%;min-height:72px;border-radius:14px;border:0;padding:12px;background:var(--sc-highest);font-family:var(--mono);font-size:12px;resize:vertical}

.snack{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:40;
  background:var(--inv);color:var(--on-inv);padding:14px 20px;border-radius:12px;font-weight:500;max-width:min(560px,calc(100vw - 32px));transition:all .35s var(--spring)}
.snack.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:900px){.snack{bottom:28px}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}
/* ---- expressive motion & new parts ---- */
.btn,.ib,.chip,.cbg button,.fab,.nav .ind,.swatch,.recfab{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;pointer-events:none;background:currentColor;opacity:.2;transform:scale(0);animation:rip .6s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes rip{to{transform:scale(1);opacity:0}}
.view.enter>*{animation:rise .65s var(--spring) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.96)}}
.pads.pop .pad{animation:padin .6s var(--spring) both;animation-delay:calc(var(--i,0)*24ms)}
@keyframes padin{from{opacity:0;transform:scale(.55) rotate(-8deg)}}
.nav button[aria-current="page"] .ind{animation:indin .55s var(--spring)}
@keyframes indin{from{transform:scaleX(.3)}}
.sc.on{animation:cellpop .4s var(--spring)}
@keyframes cellpop{from{transform:scale(.4)}}
.logo.live{animation:morph 2.6s ease-in-out infinite}
@keyframes morph{0%{border-radius:14px 22px 14px 22px;transform:rotate(0)}25%{border-radius:50%;transform:rotate(45deg) scale(.92)}50%{border-radius:22px 14px 22px 14px;transform:rotate(90deg)}75%{border-radius:10px;transform:rotate(135deg) scale(1.05)}100%{border-radius:14px 22px 14px 22px;transform:rotate(180deg)}}
.fab .ms{transition:transform .55s var(--spring)}.fab.on .ms{transform:rotate(180deg)}

document.addEventListener('input',e=>{if(e.target.classList&&e.target.classList.contains('m'))fill(e.target)});
let snt;function snack(m){const s=$('snack');s.textContent=m;s.classList.add('show');clearTimeout(snt);snt=setTimeout(()=>s.classList.remove('show'),2800)}
function applyLang(){$('snd').innerHTML='';root.lang=S.lang==='cz'?'cs':S.lang;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
  document.querySelectorAll('[data-tp]').forEach(e=>e.placeholder=t(e.dataset.tp));renderTransport();setView(view)}

// keyboard
const held=new Set();
addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;const k=e.key.toLowerCase();
  if(e.key==='Escape'){closeSheet();return}if(e.code==='Space'){e.preventDefault();playing?stop():start();return}if(held.has(k))return;held.add(k);
  if(view==='keys'){let i=KK.indexOf(k==='z'?'y':k);if(i>=0)note(48+oct*12+i,keyEls[i])}
  else if(view==='lab'){const i=KK.indexOf(k==='z'?'y':k);if(i>=0)labPlay(60+i)}
  else if(view==='pads'||view==='seq'){const i=PADKEYS.indexOf(k==='y'?'z':k);if(i>=0)hit(i)}});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();held.delete(k);const i=KK.indexOf(k==='z'?'y':k);if(i>=0&&keyEls[i])keyEls[i].classList.remove('down')});
addEventListener('blur',()=>held.clear());

// ================= frame loop: playhead, wavy progress, visualizer =================
const wave=$('wave'),wt=$('wtrack'),wp=$('wprog'),viz=$('viz'),vx=viz.getContext('2d'),vbuf=new Uint8Array(ana.frequencyBinCount);
let phase=0,prog=0,lastT=performance.now();
function frame(now){const dt=now-lastT;lastT=now;if(playing)stats.ms+=dt;
  while(vq.length&&vq[0].t<=ac.currentTime){const {s}=vq.shift();setPh(s);prog=(s+1)/NS;for(let p=0;p<NP;p++)if(cur.steps[p][s]&&!cur.pads[p].m)flash(p)}
  if(!playing)prog=0;
  phase+=playing?.12:0;const W=wave.clientWidth||0;if(W){const x1=Math.max(0,prog*W);let d='M2 10';for(let x=2;x<=x1;x+=3)d+=` L${x} ${10+(playing?4:0)*Math.sin(x/7-phase)}`;
    wp.setAttribute('d',x1>4?d:'');wt.setAttribute('d',`M${Math.min(W-2,x1+(x1>4?10:2))} 10 L${W-2} 10`)}
  drawRing();if(view==='studio'&&splay){posPh();if(curSPos()>sEnd()+.3){sStop();sPos=0;posPh()}}
  if(view==='mix'){const w=viz.clientWidth,h=viz.clientHeight,dpr=Math.min(2,devicePixelRatio||1);if(viz.width!==w*dpr){viz.width=w*dpr;viz.height=h*dpr}
    vx.setTransform(dpr,0,0,dpr,0,0);vx.clearRect(0,0,w,h);ana.getByteFrequencyData(vbuf);const n=48,bw=w/n;vx.fillStyle=getComputedStyle(root).getPropertyValue('--primary');
    for(let i=0;i<n;i++){const v=vbuf[Math.floor(Math.pow(i/n,1.6)*vbuf.length*.7)]/255,bh=Math.max(6,v*(h-16));const x=i*bw+2,y=(h-bh)/2;vx.beginPath();vx.roundRect?vx.roundRect(x,y,bw-4,bh,(bw-4)/2):vx.rect(x,y,bw-4,bh);vx.fill()}}
  if(view==='lab')drawScope();
  if(mixRec)$('rtime').textContent=fmtT((performance.now()-recT0)/1000);
  requestAnimationFrame(frame)}

// ================= boot =================
applyPrefs();applyTheme();applyMix();setEcho();$('pname').textContent=cur.name;
$('avbtn').textContent=(S.name.trim()[0]||'?').toUpperCase();root.style.setProperty('--shape-hit',shapeCss('circle'));applyLang();requestAnimationFrame(frame);splash();cloudInit();
addEventListener('pagehide',save);
})();
</script>
