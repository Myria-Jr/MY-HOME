name: Atoll APK bauen

on:
  push:
    paths:
      - "island-android/**"
      - ".github/workflows/island-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: island-android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Atoll.apk

      - name: APK als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Atoll-APK
          path: island-android/Atoll.apk

      - name: Release mit APK erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: atoll-v3.0.${{ github.run_number }}
          name: Atoll 3.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: island-android/Atoll.apk
          body: |
            📱 **Atoll.apk** unten herunterladen → auf dem Handy öffnen → installieren.
            Danach in der App: Bedienungshilfe + Mitteilungszugriff einschalten.
