name: Island APK bauen

on:
  push:
    paths:
      - "island-android/**"
      - ".github/workflows/island-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: island-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Island.apk

      - name: APK als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Island-APK
          path: island-android/Island.apk

      - name: Release mit APK erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: island-v1.0.${{ github.run_number }}
          name: Island 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: island-android/Island.apk
          body: |
            📱 **Island.apk** unten herunterladen → auf dem Handy öffnen → installieren.
            Danach in der App: Bedienungshilfe + Mitteilungszugriff einschalten.
