name: Android APK

on:
  push:
    paths: ["smycka-studio.html", "android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: Bundle web app into the APK
        run: |
          mkdir -p android/app/src/main/assets
          { printf '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">\n'; cat smycka-studio.html; } > android/app/src/main/assets/index.html
      - name: Build APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Smycka.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Smycka-APK
          path: Smycka.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Smyčka Android ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: "Smycka.apk herunterladen, öffnen, installieren. (Unbekannte Apps erlauben.)"
          files: Smycka.apk
