name: Build APK

on:
  push:
    paths:
      - "abo-detox/**"
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk Tidy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Tidy-apk
          path: Tidy.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v3.${{ github.run_number }}" Tidy.apk \
            --target "$GITHUB_SHA" \
            --title "Tidy v3.${{ github.run_number }}" \
            --notes "APK aufs Handy laden, öffnen, installieren. Bei Bedarf „Aus unbekannten Quellen installieren“ erlauben." \
            --latest
