name: Lumora Home APK bauen

on:
  push:
    paths:
      - "launcher-android/**"
      - ".github/workflows/home-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher-android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk LumoraHome.apk

      - name: APK als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: LumoraHome-APK
          path: launcher-android/LumoraHome.apk

      - name: Release mit APK erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lumora-home-v4.1.${{ github.run_number }}
          name: Lumora Home 4.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: launcher-android/LumoraHome.apk
          body: |
            🏠 **LumoraHome.apk** herunterladen → installieren → Home-Taste drücken → „Lumora Home“ als Standard wählen.
            Looks: Apple · Android · One UI 9 · Galaxy Klassik · Nothing · ColorOS
